name: Deploy Spring Boot API

on:
  workflow_dispatch:
  push:
    branches:
      - prod-oracle

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'oracle'

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw -B clean package -DskipTests

      - name: Copy JAR to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host:       ${{ secrets.SSH_HOST }}
          username:   ${{ secrets.SSH_USER }}
          key:        ${{ secrets.SSH_KEY }}
          source:     "target/tennis-book-0.0.1-SNAPSHOT.jar"
          target:     "/home/mzakbar/apps/tennis-book-service/"

      - name: Restart backend via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host:       ${{ secrets.SSH_HOST }}
          username:   ${{ secrets.SSH_USER }}
          key:        ${{ secrets.SSH_KEY }}
          script: |
            set -e
            # move jar into place if needed (example)
            cd /home/mzakbar/apps/tennis-book-service
            # optional: keep a backup
            mv tennis-book-0.0.1-SNAPSHOT.jar tennis-book-0.0.1-SNAPSHOT.jar.bak || true
            mv target/tennis-book-0.0.1-SNAPSHOT.jar tennis-book-0.0.1-SNAPSHOT.jar
            sudo systemctl restart ${SERVICE_NAME}.service
            sudo systemctl status  ${SERVICE_NAME}.service --no-pager
